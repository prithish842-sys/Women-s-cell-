services:
  postgres:
    image: postgres:16
    container_name: singa_pen_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-singa_pen_local_dev_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-singa_pen_portal}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - singa_pen_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-singa_pen_portal}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  singa_pen_postgres_data:
